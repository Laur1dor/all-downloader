services:
  bot:
    build: .
    container_name: tiktok-bot
    env_file:
      - .env
    environment:
      DB_HOST: postgres
      # SOCKS proxy (xray) for adaptive VLESS fallback; empty = always direct.
      PROXY_URL: ${PROXY_URL:-}
      # HTTP proxy for spotdl (Spotify API is geo-blocked); empty = direct.
      SPOTDL_HTTP_PROXY: ${SPOTDL_HTTP_PROXY:-}
      # Free public fallback pool (xray's second SOCKS inbound); empty = disabled.
      GOIDA_PROXY_URL: ${GOIDA_PROXY_URL:-}
      # Curated bypass pool for IP-reputation-blocked sites (DDoS-Guard etc.).
      BYPASS_PROXY_URL: ${BYPASS_PROXY_URL:-}
    extra_hosts:
      # Telegram API resolved statically, bypassing DNS (provider DNS may be unreliable).
      - "api.telegram.org:149.154.167.220"
      - "osx.telegram.org:149.154.167.220"
    volumes:
      - ./data:/app/data        # data/cookies.txt for Instagram/PornHub auth
    ports:
      - "30080:30080"           # health endpoint, useful for external uptime monitors
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:30080/health', timeout=5)
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  # Adaptive VLESS routing: xray exposes a local SOCKS/HTTP proxy fed by the
  # subscription/configs. The bot routes a platform through it only while that
  # platform is unreachable directly. Enable with the "vless" profile and set
  # PROXY_URL=socks5h://xray:2080 in .env.
  xray:
    build:
      context: .
      dockerfile: Dockerfile.xray
    container_name: xray
    profiles: ["vless"]
    environment:
      VLESS_SUBSCRIPTION: ${VLESS_SUBSCRIPTION:-}
      VLESS_CONFIGS: ${VLESS_CONFIGS:-}
      VLESS_CONFIGS_FILE: ${VLESS_CONFIGS_FILE:-}
      VLESS_UPDATE_INTERVAL: ${VLESS_UPDATE_INTERVAL:-21600}
      # Free public fallback pool (exposed on its own SOCKS :2079).
      GOIDA_SUBSCRIPTIONS: ${GOIDA_SUBSCRIPTIONS:-}
      GOIDA_POOL_SIZE: ${GOIDA_POOL_SIZE:-50}
      # Curated premium bypass pool (comma-sep vless://) on SOCKS :2078.
      BYPASS_CONFIGS: ${BYPASS_CONFIGS:-}
      # Prober: only ~2-5% of the free links survive DPI, so nodes are verified
      # before they reach the pool. SAMPLE candidates are fetched per round, the
      # TCP-reachable ones are then really dialled through a throwaway xray until
      # TARGET live nodes are found or DEEP attempts are spent.
      GOIDA_PROBE_SAMPLE: ${GOIDA_PROBE_SAMPLE:-900}
      GOIDA_PROBE_DEEP: ${GOIDA_PROBE_DEEP:-400}
      GOIDA_LIVE_TARGET: ${GOIDA_LIVE_TARGET:-25}
      GOIDA_PROBE_INTERVAL: ${GOIDA_PROBE_INTERVAL:-1800}
      # One CPU core on the box: more parallel probes just thrash.
      GOIDA_PROBE_DEEP_WORKERS: ${GOIDA_PROBE_DEEP_WORKERS:-6}
    volumes:
      # read-write: routing.toml is read here and the goida pool cache
      # (data/goida_cache.txt) is written here so the free pool survives a
      # throttled subscription fetch instead of collapsing to zero nodes.
      - ./data:/app/data
    restart: unless-stopped

  # Cloudflare WARP as a SOCKS5 proxy (warp:1080). Gives a single stable
  # Cloudflare egress IP for a whole session — needed by sites behind DDoS-Guard
  # (e.g. rule34video), whose clearance is IP-bound, so the free pool's
  # per-connection exit rotation can't hold it. Routed to by a routing.toml
  # entry of the form  rule34video = "socks5h://warp:1080".
  warp:
    image: caomingjun/warp
    container_name: warp
    # Своим профилем: WARP нужен не всем, кто включает vless, и наоборот —
    # где VLESS не проходит, WARP может быть единственным рабочим выходом.
    profiles: ["warp"]
    cap_add: [NET_ADMIN]
    devices: ["/dev/net/tun"]
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=0
      - net.ipv4.conf.all.src_valid_mark=1
    environment:
      WARP_SLEEP: "5"
    volumes:
      - warp-data:/var/lib/cloudflare-warp
    restart: unless-stopped

  # Routes the Bot API server's traffic to Telegram through a tunnel. Telegram's
  # MTProto is often DPI-throttled even where HTTPS works, so the self-hosted Bot
  # API needs one to reach Telegram at all. Which tunnel is TUN2SOCKS_PROXY's
  # choice — the xray pool or WARP. The bot reaches the Bot API via this
  # container's "telegram-bot-api" network alias.
  tun2socks:
    image: xjasonlyu/tun2socks:latest
    container_name: tun2socks
    profiles: ["local-api"]
    cap_add: [NET_ADMIN]
    devices: ["/dev/net/tun"]
    environment:
      LOGLEVEL: info
      # Which tunnel carries Telegram traffic. Defaults to the VLESS pool; set
      # TUN2SOCKS_PROXY=socks5://warp:1080 in .env to fail over to WARP when the
      # VLESS provider is blocked (DPI cert substitution kills the whole pool).
      PROXY: ${TUN2SOCKS_PROXY:-socks5://xray:2080}
    networks:
      default:
        aliases: [telegram-bot-api]
    # No depends_on: the tunnel it dials is chosen by TUN2SOCKS_PROXY and may
    # live in either proxy profile, so naming one here would make the other
    # combination an invalid project. tun2socks retries until the proxy is up.
    restart: unless-stopped

  # Self-hosted Bot API server: removes the 50 MB upload limit (up to 2 GB).
  # Needs TELEGRAM_API_ID/TELEGRAM_API_HASH in .env (https://my.telegram.org)
  # and TELEGRAM_API_URL=http://telegram-bot-api:8081 for the bot.
  # Start with the "local-api" profile, plus whichever proxy profile provides
  # the tunnel named in TUN2SOCKS_PROXY ("vless" or "warp").
  telegram-bot-api:
    build:
      context: .
      dockerfile: Dockerfile.botapi
    container_name: telegram-bot-api
    profiles: ["local-api"]
    network_mode: "service:tun2socks"   # all Telegram traffic via the tunnel
    environment:
      TELEGRAM_API_ID: ${TELEGRAM_API_ID:-}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH:-}
    volumes:
      - bot-api-data:/var/lib/telegram-bot-api
    depends_on: [tun2socks]
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    container_name: postgres-tiktok
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  pgdata:
  bot-api-data:
  warp-data:
