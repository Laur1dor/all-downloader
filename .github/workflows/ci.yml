name: CI

# The tests run inside the image the bot actually ships in, rather than against
# a pip install on the runner. The dependency set here is fussy — aiogram pins
# aiohttp, curl_cffi carries its own TLS build, yt-dlp and gallery-dl move
# constantly — so "it passed in CI" is only worth something if CI is the same
# ground the thing runs on.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Read, and nothing else. Nothing here publishes, comments or tags, and a token
# that cannot write is one that cannot be turned against the repository by
# anything that finds its way into a build. Note the trigger is pull_request and
# not pull_request_target: a pull request from a fork runs without access to
# repository secrets, which is the whole difference between the two.
permissions:
  contents: read

concurrency:
  # A second push supersedes the first: nothing here is worth finishing twice.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build the bot image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          load: true
          tags: bot-ci:${{ github.sha }}
          # Without a cache every run reinstalls ffmpeg, the whole requirements
          # set and spotdl's own venv, which is minutes of nothing.
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Nightly backup routing regression
        # Private backup commits can replace data/routing.toml. Exercise both
        # route shapes on every run using synthetic configuration.
        run: |
          docker run --rm --network none -e PYTHON_DOTENV_DISABLED=1 -e ROUTING_FILE=/dev/null \
            -v "$PWD:/src:ro" -w /src bot-ci:${{ github.sha }} python -m unittest \
            tests.test_tikwm_fallback.TikwmFallbackTests.test_confirmed_video_failure_does_not_become_photo

      - name: Smoke tests
        # Mounted over the image's own copy so the tests see the checkout,
        # including proxy/ and tests/, exactly as the deploy does on the server.
        run: |
          protected_env="$(mktemp)"
          trap 'sudo rm -f "$protected_env"' EXIT
          sudo chown root:root "$protected_env"
          sudo chmod 600 "$protected_env"
          docker run --rm --network host -e OPERATIONAL_TEST_DSN=postgresql://ci:ci@127.0.0.1:5432/ci \
            -e DASHBOARD_TEST_DSN=postgresql://ci:ci@127.0.0.1:5432/ci \
            -e OPERATOR_DB_INTEGRATION=1 -e OPERATOR_TEST_DSN=postgresql://ci:ci@127.0.0.1:5432/ci \
            -v "$PWD:/src" -v "$protected_env:/src/.env:ro" -w /src \
            bot-ci:${{ github.sha }} python -m tests.smoke_test

      - name: Offline ASR regression with test-only NumPy
        # Same NumPy as the installed iglogin image. Only this disposable test
        # container gains the dependency; production bot requirements stay lean.
        run: |
          docker run --rm --user 0 -e PYTHON_DOTENV_DISABLED=1 \
            -v "$PWD:/src:ro" -w /src --entrypoint sh bot-ci:${{ github.sha }} -c '
              python -m pip install --no-cache-dir numpy==2.5.4 &&
              python -m unittest tests.test_ig_audio_transcribe.AudioTranscribeTests.test_uses_only_local_tiny_model_and_clean_json_stdout -v
            '

  images:
    # The bot image is covered by the job above; these are the ones that would
    # otherwise only be found broken at deploy time.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        dockerfile: [Dockerfile.xray, Dockerfile.singbox, Dockerfile.botapi, Dockerfile.awg]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build ${{ matrix.dockerfile }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          load: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: compose.yml is valid
        # Every value the file interpolates has a default or is supplied here,
        # so an empty env_file is enough to validate a checkout without the
        # server's private .env. Compose still requires that file to exist.
        env:
          DB_NAME: ci
          DB_USER: ci
          DB_PASSWORD: ci
        run: |
          touch .env
          docker compose -f compose.yml config --quiet
